# Reverse-Proxy-Referenzkonfiguration (M19) — TLS-Terminierung + WSS + /metrics-Schutz.
# Einbindung optional via docker-compose.prod.yml (Profil "proxy").

# ── HTTP (Port 80): Let's-Encrypt-Challenge + Weiterleitung auf HTTPS ──────────
server {
    listen 80;
    server_name coworking.example.org;

    # ACME HTTP-01 Challenge (certbot) erreichbar lassen
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # alles andere auf HTTPS umleiten
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS (Port 443): TLS-Terminierung + Weiterleitung an die App ─────────────
server {
    listen 443 ssl;
    server_name coworking.example.org;

    ssl_certificate /etc/letsencrypt/live/coworking.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/coworking.example.org/privkey.pem;

    # /metrics NICHT von außen erreichbar — nur internes Monitoring (M19/M20-Abgleich §3).
    # Defense-in-Depth: die App verlangt zusätzlich ein METRICS_TOKEN (siehe BETRIEB.md).
    # Prometheus scrapt intern direkt app:3000/metrics mit Token, nicht über diesen Proxy.
    location = /metrics {
        deny all;
    }

    # WebSocket (Yjs-Echtzeit-Sync) — HTTP-Upgrade durchreichen (WSS)
    location /sync/ {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;

        proxy_read_timeout 3600s;
    }

    # REST-API + restliche Routen
    location / {
        proxy_pass http://app:3000;
        proxy_set_header Host $host;
    }
}
