# Package-Build: baut das Docker-Image und pusht es nach GHCR (GitHub Container Registry).
# Läuft bei Push auf main (= erfolgreich gemergter PR), wie im Plattform-Onboarding gefordert,
# damit nur geprüfter Code ein Package erzeugt. Ergebnis: GitHub → Packages.
# Danach die values.yaml beim Plattform-Team zur Eintragung melden.
name: Package Build (GHCR)

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/coworking-api:latest
            ghcr.io/${{ github.repository }}/coworking-api:${{ github.sha }}
