name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: projekt5_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: projekt5_test
      DB_USER: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: localhost
      REDIS_PORT: 6379

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Node.js 20 einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: TypeScript kompilieren
        run: npm run build

      - name: Linting
        run: npm run lint

      - name: Tests ausführen
        run: npm test

  # Baut das Docker-Image und veröffentlicht es in der GitHub Container Registry.
  # Läuft nur bei Push auf main und erst nach grünem CI-Job (needs), damit kein
  # ungeprüfter Stand ein Package erzeugt. Ergebnis sichtbar unter GitHub → Packages.
  # Nach der ersten Veröffentlichung die values.yaml beim Plattform-Team zur
  # Eintragung melden.
  publish:
    name: Docker Image bauen und zu GHCR hochladen
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Buildx einrichten
        uses: docker/setup-buildx-action@v3

      - name: Bei GHCR einloggen
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR akzeptiert nur kleingeschriebene Namen, github.repository liefert die
      # Originalschreibweise des Kontos. Ohne diesen Schritt bricht der Push ab.
      - name: Image-Namen kleinschreiben
        run: echo "IMAGE=ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr "[:upper:]" "[:lower:]")/coworking-api" >> "$GITHUB_ENV"

      # Zwei Tags: latest zeigt immer auf den aktuellen main-Stand, der SHA-Tag
      # macht jedes Image einem Commit zuordenbar (Rueckverfolgbarkeit, Rollback).
      - name: Docker Image bauen und hochladen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}