name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Stufe 1: Quellcode ──────────────────────────────────────────────────────
  # Kompilieren, linten, testen. Braucht keine Datenbank: die Testsuiten mocken
  # PostgreSQL und Redis vollstaendig. Fruehere Service-Container liefen hier ins
  # Leere und sind deshalb in den Job "image" gewandert, wo sie wirklich benutzt
  # werden.
  ci:
    name: Quellcode bauen, linten und testen
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Node.js 20 einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: TypeScript kompilieren
        run: npm run build

      - name: Linting
        run: npm run lint

      - name: Tests ausführen
        run: npm test

  # ── Stufe 2: Image ──────────────────────────────────────────────────────────
  # Baut das Docker-Image, startet es einmal gegen eine echte PostgreSQL- und
  # Redis-Instanz und veroeffentlicht es erst danach in der GitHub Container
  # Registry. Ergebnis sichtbar unter GitHub → Packages.
  #
  # Warum der Startversuch noetig ist: die Unit-Tests laufen gegen Mocks und
  # koennen den Containerstart prinzipiell nicht pruefen. Genau dort passiert aber
  # die Migration (docker-entrypoint.sh). Ohne diesen Job kann ein Image als
  # "latest" in der Registry landen, das beim ersten Start abbricht.
  #
  # Der Build laeuft auch bei Pull Requests, hochgeladen wird nur bei Push auf
  # main. So faellt ein kaputtes Dockerfile schon im PR auf.
  image:
    name: Image bauen, starten und zu GHCR hochladen
    runs-on: ubuntu-latest
    needs: ci

    permissions:
      contents: read
      packages: write

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: projekt5_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Buildx einrichten
        uses: docker/setup-buildx-action@v3

      # load statt push: das Image bleibt zunaechst lokal auf dem Runner, damit es
      # getestet werden kann, bevor es jemand ziehen kann. Der Layer-Cache (gha)
      # spart beim naechsten Lauf den Neubau unveraenderter Schichten.
      - name: Image bauen (noch nicht hochladen)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: collab-kit:pruefstand
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Startet den Container so, wie ihn spaeter auch das Plattform-Team startet:
      # aus dem fertigen Image, mit Migration beim Start. --network host laesst ihn
      # die Service-Container ueber localhost erreichen.
      #
      # Geprueft wird /ready, nicht /health: /health sagt nur "Prozess laeuft",
      # /ready fragt DB und Redis wirklich an. Und weil der Entrypoint mit "set -e"
      # zuerst migriert, kann /ready ueberhaupt erst antworten, wenn die Migration
      # durchgelaufen ist. Eine gruene Antwort beweist damit beides.
      - name: Container starten und /ready abfragen
        run: |
          docker run -d --name pruefstand --network host \
            -e NODE_ENV=production \
            -e PORT=3000 \
            -e DB_HOST=localhost -e DB_PORT=5432 \
            -e DB_NAME=projekt5_test \
            -e DB_USER=postgres -e DB_PASSWORD=postgres \
            -e REDIS_HOST=localhost -e REDIS_PORT=6379 \
            -e RUN_MIGRATIONS=true \
            collab-kit:pruefstand

          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/ready > /dev/null 2>&1; then
              echo "Container ist bereit, Migration und Verbindungen stehen."
              exit 0
            fi
            # Vorzeitiger Abbruch: laeuft der Container nicht mehr, ist Warten sinnlos.
            if [ -z "$(docker ps -q -f name=pruefstand)" ]; then
              echo "Container ist beendet, bevor er bereit war." >&2
              break
            fi
            echo "Warte auf den Container ($i/30) ..."
            sleep 2
          done

          echo "::error::Der Container wurde nicht bereit. Logs folgen:"
          docker logs pruefstand
          exit 1

      # Laeuft auch, wenn der Startversuch fehlschlug, damit kein Container
      # zurueckbleibt.
      - name: Prüfstand abräumen
        if: always()
        run: docker rm -f pruefstand 2>/dev/null || true

      - name: Bei GHCR einloggen
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR akzeptiert nur kleingeschriebene Namen, github.repository liefert die
      # Originalschreibweise des Kontos. Ohne diesen Schritt bricht der Push ab.
      #
      # Zwei Tags: latest zeigt immer auf den aktuellen main-Stand, der SHA-Tag
      # macht jedes Image einem Commit zuordenbar (Rueckverfolgbarkeit, Rollback).
      # Hochgeladen wird genau das Image, das eben gestartet ist, nicht ein zweiter
      # Build. Sonst waere die Pruefung wertlos.
      - name: Geprüftes Image hochladen
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMAGE="ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          docker tag collab-kit:pruefstand "$IMAGE:latest"
          docker tag collab-kit:pruefstand "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"
          docker push "$IMAGE:$GITHUB_SHA"
