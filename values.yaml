# ==============================================================================
# Kubernetes-Values für die Anbindung an die Plattform (Projekt 1) via ArgoCD.
# Ausgefüllt nach der Onboarding-Vorlage. Details: docs/Integrationsleitfaden-Projekt1.md
# Platzhalter <…> vor einem echten Deployment durch die Plattform-Werte ersetzen.
# ==============================================================================

app:
  name: "coworking-api"
# Verhindert K8s-Namensdopplungen — identisch zu app.name.
fullnameOverride: "coworking-api"

replicaCount: 1

image:
  # GHCR-Package aus der CI (.github/workflows/package.yml), OHNE Tag am Ende.
  repository: "ghcr.io/<owner>/<repo>/coworking-api"
  # Erstes Deployment mit "latest"; danach übernimmt ArgoCD die Aktualisierung.
  tag: "latest"

# Privates GHCR → Zugangs-Secret der Plattform.
imagePullSecrets:
  - name: github-ghcr

service:
  # Interner Container-Port (HTTP-API + WebSocket) — siehe Dockerfile EXPOSE 3000.
  port: 3000

ingress:
  # Die Plattform routet zentral über das Traefik-Gateway → hier zwingend false.
  enabled: false
  path: "/coworking"

env:
  NODE_ENV: "production"
  # In Produktion Pflicht (Fail-fast in src/app.ts — sonst startet der Server nicht):
  CORS_ORIGIN: "https://<plattform-frontend-origin>"
  AUTH_SERVICE_URL: "http://<mock-auth-service>/validate"   # gemockte Auth: Token → User-ID
  # Eigene Datenbank-/Cache-Instanz (separater PostgreSQL + Redis auf dem THM-Server):
  DB_HOST: "<db-host>"
  DB_PORT: "5432"
  DB_NAME: "projekt5"
  DB_USER: "<db-user>"
  DB_PASSWORD: "<db-secret>"       # produktiv als K8s-Secret, nicht im Klartext
  REDIS_HOST: "<redis-host>"
  REDIS_PORT: "6379"
