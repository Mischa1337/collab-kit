services:

  # ── App-Server (Produktion) ───────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=projekt5
      - DB_USER=postgres
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - AUTH_SERVICE_URL=${AUTH_SERVICE_URL}
      - METRICS_TOKEN=${METRICS_TOKEN}
      - PORT=3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Kein Volume-Mount: Code ist im Image eingebacken, kein Hot-Reload
    command: sh -c "npm run build && npm start"
    restart: unless-stopped

  # ── PostgreSQL (Produktion) ───────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: projekt5
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    # Kein externer Port — nur App-internes Netzwerk
    expose:
      - '5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis (Produktion) ────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Kein externer Port — nur App-internes Netzwerk
    expose:
      - '6379'
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Reverse Proxy + TLS (optional, M19) ───────────────────────────────────
  # Nur mit Profil aktiv:  docker compose -f docker-compose.prod.yml --profile proxy up -d
  # Benötigt gültige Zertifikate unter /etc/letsencrypt (siehe BETRIEB.md, Let's Encrypt).
  nginx:
    image: nginx:1.27-alpine
    profiles: ['proxy']
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot
    depends_on:
      - app

volumes:
  postgres_data:
  redis_data:
  certbot_webroot:
